<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit task — Handoff</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="detail-page"><a class="skip-link" href="#main">Skip to main content</a><main id="main" class="briefing-wrap edit-task-wrap"><a class="back-link" href="{{ url_for('dashboard') }}#task-board">← Back to task board</a><header class="briefing-header"><div><div class="section-kicker">TASK BOARD</div><h1>Edit task</h1><p>Update ownership, priority, deadline, and context.</p></div></header>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack" aria-live="polite">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
<form method="post" class="edit-task-form"><label for="title">Task title</label><input id="title" name="title" maxlength="180" required value="{{ task.title }}"><div class="edit-grid"><div><label for="project">Project</label><input id="project" name="project" maxlength="100" value="{{ task.project }}"></div><div><label for="owner">Owner</label><input id="owner" name="owner" maxlength="100" value="{{ task.owner }}"></div><div><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" value="{{ task.due_date }}"></div><div><label for="priority">Priority</label><select id="priority" name="priority">{% for p in priorities %}<option {% if task.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div><div><label for="team_id">Team</label><select id="team_id" name="team_id"><option value="">No team / unassigned</option>{% for team in teams %}<option value="{{ team.id }}" {% if task.team_id == team.id %}selected{% endif %}>{{ team.name }}</option>{% endfor %}</select></div><div><label for="status">Status</label><select id="status" name="status">{% for s in statuses %}<option {% if task.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div></div><label for="description">Context</label><textarea id="description" name="description" rows="5" maxlength="1200">{{ task.description }}</textarea><div class="briefing-actions"><a class="secondary-button" href="{{ url_for('dashboard') }}#task-board">Cancel</a><button class="primary-button" type="submit">Save task →</button></div></form></main></body></html>
